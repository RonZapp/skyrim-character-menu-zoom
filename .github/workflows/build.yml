name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg (full history for builtin-baseline)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: cmd
        run: cmake --preset build-release-msvc

      - name: Build
        shell: cmd
        run: cmake --build --preset release-msvc

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: CharacterSheet-plugin
          path: contrib/PluginRelease1130/skse/plugins/
          if-no-files-found: error
